<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F3ED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wealthy">
<title>Wealthy — Catatan Keuangan Pribadi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=9">
<script src="vendor/chart.umd.min.js?v=9"></script>
<script src="app.js?v=9" defer></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="masthead">
      <div class="monogram">W<span>.</span></div>
      <div class="masthead-text">
        <div class="masthead-name">Wealthy</div>
        <div class="masthead-meta">Catatan keuangan pribadi</div>
      </div>
    </div>

    <div class="rail-section">
      <div class="rail-label"><span>01</span> Navigasi</div>
      <nav class="nav" id="nav"></nav>
    </div>

    <div class="rail-note">
      <div class="rail-label">Catatan</div>
      <p>Data disimpan di perangkat ini. Unduh salinan cadangan dari menu <strong>Pengaturan</strong> secara berkala.</p>
      <div class="rail-rule"></div>
      <p class="rail-small">Pelan-pelan, yang penting konsisten.</p>
    </div>
  </aside>

  <div id="overlay" data-action="close-sidebar"></div>

  <main id="main">
    <header class="topbar">
      <button class="icon-btn" data-action="toggle-sidebar" aria-label="Buka menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-heading">
        <div class="topbar-kicker" id="today-line">—</div>
        <h1 id="page-title">Dashboard</h1>
        <p id="page-subtitle">Ringkasan keuangan Anda hari ini</p>
      </div>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" data-action="toggle-theme" id="theme-btn" aria-label="Ganti tema"></button>
      <button class="btn-primary topbar-add" data-action="add-tx">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        <span>Catat Transaksi</span>
      </button>
    </header>
    <div id="content"></div>
    <footer class="site-foot">
      <span>Wealthy · Catatan keuangan pribadi</span>
      <span id="foot-stamp">—</span>
    </footer>
  </main>
</div>

<button id="fab" data-action="add-tx" aria-label="Catat transaksi">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
